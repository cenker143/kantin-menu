<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantin Menü</title>

<style>
body {font-family: Arial; background:#f5f5f5; margin:0;}
header {
  background:white;
  padding:15px;
  text-align:center;
  font-weight:bold;
  font-size:18px;
}
.container {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}
.card {
  background:white;
  border-radius:12px;
  padding:10px;
  text-align:center;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}
.card img {
  width:100%;
  height:110px;
  object-fit:cover;
  border-radius:8px;
}
.price {
  color:#0a7f2e;
  font-weight:bold;
  font-size:16px;
}
</style>
</head>

<body>

<header>
BATMAN İL JANDARMA KOMUTANLIĞI AİLE KANTİNİ ÜRÜN FİYAT LİSTESİ
</header>

<div class="container">

<div class="card">
<img src="https://source.unsplash.com/200x200/?cola">
<h4>Cola</h4>
<p class="price">25 TL</p>
</div>

<div class="card">
<img src="https://source.unsplash.com/200x200/?chips">
<h4>Cips</h4>
<p class="price">20 TL</p>
</div>

<div class="card">
<img src="https://source.unsplash.com/200x200/?toast">
<h4>Tost</h4>
<p class="price">40 TL</p>
</div>

<div class="card">
<img src="https://source.unsplash.com/200x200/?biscuit">
<h4>Bisküvi</h4>
<p class="price">10 TL</p>
</div>

</div>

</body>
</html>
