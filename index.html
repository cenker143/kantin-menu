<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kantin Menü</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  margin: 0;
}

header {
  background: white;
  padding: 15px;
  text-align: center;
  font-weight: bold;
  font-size: 18px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

input {
  width: 90%;
  margin: 15px auto;
  display: block;
  padding: 10px;
  border-radius: 10px;
  border: 1px solid #ccc;
}

.container {
  display: grid;
  grid-template-columns: repeat(auto-fill,minmax(160px,1fr));
  gap: 10px;
  padding: 10px;
}

.card {
  background: white;
  border-radius: 15px;
  padding: 10px;
  text-align: center;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.card img {
  width: 100%;
  height: 120px;
  object-fit: contain;
}

.card h3 {
  font-size: 14px;
}

.card p {
  color: green;
  font-weight: bold;
}
</style>
</head>

<body>

<header>
BATMAN İL JANDARMA KOMUTANLIĞI  
AİLE KANTİNİ ÜRÜN FİYAT LİSTESİ
</header>

<input type="text" id="search" placeholder="Ürün ara...">

<div class="container" id="urunler"></div>

<script>

const sheetURL = "https://opensheet.elk.sh/XXXX/Sheet1"; // BURAYA SHEET ID

let urunler = [];

fetch(sheetURL)
.then(res => res.json())
.then(data => {
  urunler = data;
  goster(data);
});

function goster(data) {
  let html = "";

  data.forEach(item => {
    html += `
      <div class="card">
        <img src="${item["Foto"] || 'logo.jpg'}">
        <h3>${item["Ürün Adı"]}</h3>
        <p>${item["Fiyat"]} ₺</p>
      </div>
    `;
  });

  document.getElementById("urunler").innerHTML = html;
}

document.getElementById("search").addEventListener("input", function() {
  const aranan = this.value.toLowerCase();

  const filtre = urunler.filter(x =>
    x["Ürün Adı"].toLowerCase().includes(aranan)
  );

  goster(filtre);
});

</script>

</body>
</html>
